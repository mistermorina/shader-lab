name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check dist output
        run: |
          test -f dist/index.html && echo "✅ index.html exists" || exit 1
          test -f dist/manifest.webmanifest && echo "✅ manifest exists" || exit 1
          test -f dist/sw.js && echo "✅ service worker exists" || exit 1
          test -d dist/assets && echo "✅ assets directory exists" || exit 1
          echo "📦 Build size:"
          du -sh dist/
          echo "📄 Files:"
          find dist -type f | head -20

  smoke:
    name: Browser Smoke
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:smoke

      - name: PWA offline smoke
        run: npm run test:pwa
